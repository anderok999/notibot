name: Keepalive Render

on:
  schedule:
    # Cada 10 minutos. Render duerme el plan free tras ~15 min sin tráfico.
    # GitHub puede retrasar el cron; no es una garantía de disponibilidad.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive-render
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /healthz
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            --max-time 20 \
            --retry 3 \
            --retry-delay 5 \
            https://notibot-ww99.onrender.com/healthz)
          echo "$response"
